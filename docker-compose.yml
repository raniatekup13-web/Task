services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: devtask
      POSTGRES_PASSWORD: devtask_local
      POSTGRES_DB: devtask
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devtask -d devtask"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  mailpit:
    image: axllent/mailpit:v1.22.3
    ports: ["1025:1025", "8025:8025"]
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      DATABASE_URL: postgresql://devtask:devtask_local@postgres:5432/devtask?schema=public
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-before-deploying}
      API_PORT: 4000
      WEB_ORIGIN: http://localhost:3000
      APP_URL: ${APP_URL:-http://localhost:3000}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: "${MAIL_FROM:-DevTask Enterprise <no-reply@example.com>}"
    ports: ["4000:4000"]
    depends_on:
      postgres: { condition: service_healthy }
      mailpit: { condition: service_started }
  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  pgdata:
